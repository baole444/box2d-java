name: Test

on:
  workflow_dispatch:
  push:
    # Skip pushes that only touch files the test run never reads. Everything else will still trigger.
    paths-ignore:
      - '**.md'
      - .gitignore
      - jextract/**
      - .github/workflows/build-natives.yml
      - .github/workflows/check-bindings.yml

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: win
            os: windows-latest
          - name: mac
            os: macos-latest   # arm64 (Apple Silicon)
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run tests
        shell: bash
        run: ./gradlew test --no-daemon
