name: Check Bindings

# Checks that jextract binding generation is host independent: the bindings are generated on Linux, Windows and macOS with the jextract fork (built from source on each runner),
# and the three outputs must be byte-identical. When the Box2D tag is the repository's binding_version, the output must also match the bindings committed under src/main/java/org/box2d/internal.
#
# Runs on its own: it does not compile the wrappers or run the test suite.

on:
  workflow_dispatch:
    inputs:
      box2d_ref:
        description: "Box2D git tag to generate from (upstream erincatto/box2d). Empty: v<binding_version> from gradle.properties"
        default: ""
        required: false
  push:
    paths:
      - build.gradle
      - gradle.properties
      - jextract/**
      - src/main/java/org/box2d/internal/**
      - .github/workflows/check-bindings.yml
  pull_request:
    paths:
      - build.gradle
      - gradle.properties
      - jextract/**
      - src/main/java/org/box2d/internal/**
      - .github/workflows/check-bindings.yml

permissions:
  contents: read

env:
  # jextract is built like the local fork: upstream openjdk/jextract at JEXTRACT_COMMIT plus
  # jextract/fork/ (fork.patch and the overlay/ files), with JDK 25 and libclang LLVM_VERSION.
  # Keep these in step with the fork.
  JEXTRACT_COMMIT: 3be13db493b35bca7b714393b89b1a2e1b2d7e13
  LLVM_VERSION: 18.1.8

jobs:
  generate:
    name: Generate on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            llvm_asset: clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          - name: win
            os: windows-latest
            llvm_asset: LLVM-18.1.8-win64.exe
          - name: mac
            os: macos-latest   # arm64 (Apple Silicon)
            llvm_asset: clang+llvm-18.1.8-arm64-apple-macos11.tar.xz
    defaults:
      run:
        shell: bash
    outputs:
      box2d_ref: ${{ steps.ref.outputs.box2d_ref }}
      binding_ref: ${{ steps.ref.outputs.binding_ref }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Resolve Box2D tag
        id: ref
        env:
          INPUT_REF: ${{ inputs.box2d_ref }}
        run: |
          version=$(grep -E '^\s*binding_version\s*=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          binding_ref="v${version}"
          box2d_ref="${INPUT_REF:-$binding_ref}"
          echo "binding_ref=${binding_ref}" >> "$GITHUB_OUTPUT"
          echo "box2d_ref=${box2d_ref}" >> "$GITHUB_OUTPUT"
          echo "Generating from Box2D ${box2d_ref} (binding_version ${binding_ref})"

      - name: Checkout Box2D source
        uses: actions/checkout@v7
        with:
          repository: erincatto/box2d
          ref: ${{ steps.ref.outputs.box2d_ref }}
          path: box2d-src

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # LLVM's official 18.1.8 Linux build (made on Ubuntu 18.04) links libclang against libtinfo.so.5, which current Ubuntu runners no longer ship.
      # Install Ubuntu 22.04's package (release pocket, so the file does not move). Needed on every run, cached jextract included.
      - name: Install libtinfo5
        if: runner.os == 'Linux'
        run: |
          deb="$RUNNER_TEMP/libtinfo5.deb"
          curl -fsSL -o "$deb" https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          echo "d2597b5aec92a930cf549e1b429ad892595813e72ec7814685ea146a9fb715e5  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      # The built jextract image is self-contained (its own runtime and libclang; on Linux also the system libtinfo5 installed above),
      # so it is cached and rebuilt only when the commit, the fork patch or the LLVM version changes.
      - name: Restore jextract
        id: jextract-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jextract-image
          key: jextract-${{ runner.os }}-${{ runner.arch }}-${{ env.JEXTRACT_COMMIT }}-${{ hashFiles('jextract/fork/**') }}-llvm${{ env.LLVM_VERSION }}-jdk25

      # Checked out by hand with autocrlf off: the patch has LF line endings, and Windows runners
      # would otherwise check the text files out as CRLF. The overlay (Gradle wrapper) is copied
      # over the checkout as is.
      - name: Fetch jextract source and apply the fork
        if: steps.jextract-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/jextract-src"
          git init -q "$src"
          git -C "$src" config core.autocrlf false
          git -C "$src" remote add origin https://github.com/openjdk/jextract.git
          git -C "$src" fetch -q --depth 1 origin "$JEXTRACT_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" apply "$GITHUB_WORKSPACE/jextract/fork/fork.patch"
          cp -R "$GITHUB_WORKSPACE/jextract/fork/overlay/." "$src/"
          git -C "$src" status --short

      # jextract's build takes libclang from <llvm_home>/<bin|lib> and the clang builtin headers
      # from <llvm_home>/lib/clang/<version>/include. Only those are staged into a small
      # llvm_home, which keeps the cached image small. Relative paths for tar: GNU tar on
      # Windows reads "D:\..." as a remote host.
      - name: Download libclang
        if: steps.jextract-cache.outputs.cache-hit != 'true'
        id: llvm
        run: |
          asset="${{ matrix.llvm_asset }}"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset" "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${asset}"
          case "$RUNNER_OS" in
            Linux)
              top="${asset%.tar.xz}"
              tar -xJf "$asset" --wildcards "$top/lib/libclang.so*" "$top/lib/clang"
              libdir=lib; libsrc=$(readlink -f "$top/lib/libclang.so") ;;
            macOS)
              top="${asset%.tar.xz}"
              tar -xJf "$asset" "$top/lib/libclang.dylib" "$top/lib/clang"
              libdir=lib; libsrc="$top/lib/libclang.dylib" ;;
            Windows)
              top=llvm-full
              7z x -y -o"$top" "$asset" > /dev/null
              libdir=bin; libsrc="$top/bin/libclang.dll" ;;
          esac
          ver=$(ls "$top/lib/clang")
          case "$RUNNER_OS" in
            Linux) libname="libclang.so.${ver}" ;;
            *)     libname=$(basename "$libsrc") ;;
          esac
          mkdir -p llvm/lib/clang "llvm/$libdir"
          cp -R "$top/lib/clang/$ver" llvm/lib/clang/
          cp -L "$libsrc" "llvm/$libdir/$libname"
          ls -l "llvm/$libdir"
          if [ "$RUNNER_OS" = "Linux" ]; then ldd "llvm/$libdir/$libname"; fi
          home="$RUNNER_TEMP/llvm"
          if [ "$RUNNER_OS" = "Windows" ]; then home=$(cygpath -m "$home"); fi
          echo "home=${home}" >> "$GITHUB_OUTPUT"

      - name: Build jextract
        if: steps.jextract-cache.outputs.cache-hit != 'true'
        run: |
          jdk="$JAVA_HOME"
          if [ "$RUNNER_OS" = "Windows" ]; then jdk=$(cygpath -m "$jdk"); fi
          cd "$RUNNER_TEMP/jextract-src"
          chmod +x gradlew
          ./gradlew --no-daemon "-Pjdk_home=${jdk}" "-Pllvm_home=${{ steps.llvm.outputs.home }}" verify
          rm -rf "$RUNNER_TEMP/jextract-image"
          cp -R build/jextract "$RUNNER_TEMP/jextract-image"

      - name: Locate jextract
        id: jextract
        run: |
          cmd="$RUNNER_TEMP/jextract-image/bin/jextract"
          if [ "$RUNNER_OS" = "Windows" ]; then cmd="${cmd}.bat"; fi
          "$cmd" --version
          # Gradle needs a native path on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then cmd=$(cygpath -w "$cmd"); fi
          echo "cmd=${cmd}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Generate bindings
        run: >
          ./gradlew runJextract --no-daemon
          "-Pbox2dInclude=box2d-src/include"
          "-PjextractCmd=${{ steps.jextract.outputs.cmd }}"

      - name: Upload bindings
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.name }}
          path: build/generated/jextract/org/box2d/internal/
          if-no-files-found: error

  cross-platform:
    name: Identical on every platform
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Download bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: generated

      - name: Compare with the Linux output
        run: |
          status=0
          for p in win mac; do
            if diff -r generated/bindings-linux "generated/bindings-$p" > "diff-$p.txt"; then
              echo "linux and $p outputs are identical ($(ls generated/bindings-linux | wc -l) files)"
            else
              echo "::error::Bindings generated on $p differ from those generated on linux"
              head -n 100 "diff-$p.txt"
              status=1
            fi
          done
          exit $status

  committed:
    name: Committed bindings up to date
    needs: generate
    if: needs.generate.outputs.box2d_ref == needs.generate.outputs.binding_ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Download Linux bindings
        uses: actions/download-artifact@v8
        with:
          name: bindings-linux
          path: generated

      # Handwritten files in the package (e.g. nBox2D.java) lack the jextract marker and are skipped.
      - name: Compare with src/main/java/org/box2d/internal
        run: |
          mkdir committed
          for f in src/main/java/org/box2d/internal/*.java; do
            if head -n 1 "$f" | grep -q '^// Generated by jextract'; then cp "$f" committed/; fi
          done
          if diff -r committed generated > diff.txt; then
            echo "Committed bindings match the generated ones ($(ls generated | wc -l) files)"
          else
            echo "::error::Committed bindings differ from the generated ones; run ./gradlew generateBindings and commit the result"
            head -n 100 diff.txt
            exit 1
          fi
